  const maxV = Math.max(1, ...items.map(x => x.v)), W = 340, H = 120, bw = W / Math.max(items.length, 1);
  let s = `<svg viewBox="0 0 ${W} ${H + 34}" role="img" aria-label="${esc(label)}">`;
  [.5, 1].forEach(g => s += `<line class="gridln" x1="0" x2="${W}" y1="${H - H * .9 * g}" y2="${H - H * .9 * g}"/>`);
  s += `<text class="axis" x="0" y="${H - H * .9 - 4}">${fmtK(maxV)} lb</text>`;
  items.forEach((x, i) => { const bh = Math.max(x.v / maxV * H * .9, 2), X = i * bw + bw * .18, on = current(x, i); s += `<rect x="${X.toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${bh.toFixed(1)}" rx="4" style="fill:${on ? "var(--accent)" : "var(--panel2)"};stroke:${on ? "none" : "var(--line)"}"><title>${esc(x.title)}</title></rect>`; if (x.top) s += `<text class="axis" x="${(X + bw * .32).toFixed(1)}" y="${(H - bh - 4).toFixed(1)}" text-anchor="middle">${esc(x.top)}</text>`; if (x.label) s += `<text class="axis" x="${(X + bw * .32).toFixed(1)}" y="${H + 16}" text-anchor="middle">${esc(x.label)}</text>`; });
  return s + "</svg>";
}
function viewProgress(v) {
  const ws = strength(), all = allWorkouts();
  if (S.workouts === null && S.conn !== "off") { v.innerHTML = loadingCard("your progress"); return; }
  const now = new Date(), w0 = ymd(weekStart(now)), m30 = ymd(new Date(now - 30 * 864e5));
  const thisWk = all.filter(w => w.date >= w0), volWk = thisWk.reduce((a, w) => a + (w.volume || 0), 0);
  let h = `<h2>Summary</h2><div class="tiles"><div class="tile"><b>${thisWk.length}</b><span>this week</span></div><div class="tile"><b>${all.filter(w => w.date >= m30).length}</b><span>last 30 days</span></div><div class="tile"><b>${fmtK(volWk)}</b><span>lb this week</span></div></div>`;
  const life = lifetime(), ff = funFact(life, 3);
  if (ff) h += `<div class="fact" style="margin-top:10px"><div class="ico">${ff.ico}</div><div><b>${fmtN(life)} lb</b> lifted all-time across ${ws.length} workouts. About <b>${esc(ff.text)}</b>.</div></div>`;

  // each session's total weight moved
  const last = ws.slice(0, 16).reverse();
  h += `<h2>Weight moved per session</h2><div class="card chart">`;
  h += last.length ? barChart(last.map((w, i) => ({ v: w.volume || 0, title: `${w.date} ${w.routine}: ${fmtN(w.volume || 0)} lb`, label: i % 3 === 0 || i === last.length - 1 ? `${parseYmd(w.date).getMonth() + 1}/${parseYmd(w.date).getDate()}` : "", top: "" })), "Weight moved per session", (x, i) => i === last.length - 1) + `<div class="tiny muted">Pounds moved each workout (weight × reps, every set). Latest in blue.</div>` : `<div class="empty">Finish a workout to see this chart.</div>`;
  h += `</div>`;
  // weekly volume, 12 weeks
  const weeks = []; for (let i = 11; i >= 0; i--) { const s = weekStart(now); s.setDate(s.getDate() - 7 * i); const k = ymd(s), e = new Date(s); e.setDate(e.getDate() + 7); const ke = ymd(e); const list = all.filter(w => w.date >= k && w.date < ke); weeks.push({ v: list.filter(w => w.kind !== "cardio").reduce((a, w) => a + (w.volume || 0), 0), title: `Week of ${s.toLocaleDateString()}: ${list.length} sessions`, label: i % 3 === 0 || i === 0 ? `${s.getMonth() + 1}/${s.getDate()}` : "", top: list.length ? String(list.length) : "" }); }
  h += `<h2>Weekly volume</h2><div class="card chart">${barChart(weeks, "Weekly volume, last 12 weeks", (x, i) => i === 11)}<div class="tiny muted">Bars: pounds moved each week. Number on top: sessions, cardio included.</div></div>`;

  // exercise progress + max
  const names = [...new Set(ws.flatMap(w => (w.exercises || []).filter(e => info(e.name).type !== "t").map(exKey)))].sort();
  h += `<h2>Lift progress and max</h2>`;
  if (!names.length) { h += `<div class="card empty"><b>Nothing to chart yet</b>After a workout, pick a lift here to see your estimated max, test your real one, and get training weights.</div>`; v.innerHTML = h; return; }
  const ex = names.includes(S.progressEx) ? S.progressEx : names[0];
  const metric = S.chartMetric;
  const pts = ws.slice().reverse().map(w => { const e = findEx(w, ex); if (!e) return null; let best = 0, top = 0, vol = 0; working(e.sets).forEach(s => { best = Math.max(best, e1rmS(s)); top = Math.max(top, num(s.w)); vol += num(s.w) * num(s.r); }); return { d: w.date, e1rm: best, top, vol }; }).filter(p => p && (p.e1rm || p.top || p.vol));
  h += `<div class="card"><div class="field"><label for="exsel">Lift</label><select id="exsel">${names.map(n => `<option ${n === ex ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
    <div class="chips" style="margin-top:10px">${[["e1rm", "Est. max"], ["top", "Heaviest"], ["vol", "Volume"]].map(([k, l]) => `<button class="chip ${metric === k ? "on" : ""}" data-metric="${k}">${l}</button>`).join("")}</div>`;
  if (pts.length >= 2) {
    const vals = pts.map(p => p[metric]), lo = Math.min(...vals) * .95, hi = Math.max(...vals) * 1.03, rg = hi - lo || 1, CW = 340, CH = 140;
    const X = i => 8 + i / (pts.length - 1) * (CW - 16), Y = v1 => CH - (v1 - lo) / rg * (CH - 10);
    const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`).join(" ");
    let c = `<svg viewBox="0 0 ${CW} ${CH + 22}" role="img" aria-label="${esc(ex)} over time"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
    c += `<line class="gridln" x1="0" x2="${CW}" y1="${Y(hi / 1.03)}" y2="${Y(hi / 1.03)}"/><text class="axis" x="0" y="${Y(hi / 1.03) - 4}">${fmtN(hi / 1.03)} lb</text>`;
    c += `<polygon points="${X(0)},${CH} ${line} ${X(pts.length - 1)},${CH}" fill="url(#ar)"/><polyline points="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => c += `<circle cx="${X(i)}" cy="${Y(vals[i])}" r="${i === pts.length - 1 ? 5 : 3}" style="fill:${i === pts.length - 1 ? "var(--accent)" : "var(--panel)"};stroke:var(--accent)" stroke-width="2"><title>${p.d}: ${fmtN(vals[i])} lb</title></circle>`);
    c += `<text class="axis" x="${X(0)}" y="${CH + 16}">${pts[0].d.slice(5)}</text><text class="axis" x="${X(pts.length - 1)}" y="${CH + 16}" text-anchor="end">${pts[pts.length - 1].d.slice(5)}</text>`;
    h += `<div class="chart" style="margin-top:12px">${c}</svg></div><div class="tiny muted">${{ e1rm: "Estimated one-rep max from your best set each session.", top: "Heaviest weight you lifted each session.", vol: "Total pounds moved on this lift each session." }[metric]}</div>`;
  } else h += `<div class="note" style="margin-top:12px">Log ${esc(ex)} one more time to see a trend line.</div>`;
  const est = estMax(ex), tst = testedMax(ex), wm = workingMax(ex);
  h += `<div style="margin-top:10px"><div class="pr"><span>Estimated max</span><b>${est ? `${fmtN(est.v)} lb<br><span class="tiny muted">from ${est.w}×${est.r} on ${est.date.slice(5)}</span>` : "—"}</b></div>
    <div class="pr"><span>Tested max</span><b>${tst ? `${fmtN(tst.weight)} lb<br><span class="tiny muted">${tst.date}</span>` : "Not tested yet"}</b></div></div>`;
  if (wm && info(ex.split(" · ")[0]).type === "w") {
    const z = (lo, hi, rLo, rHi) => `${fmtN(weightFor(wm.v, rHi, 1))}–${fmtN(weightFor(wm.v, rLo, 1))} lb`;
    h += `<table class="zones"><thead><tr><th>Goal</th><th>Sets × reps</th><th>Weight</th></tr></thead><tbody>
      <tr><td><b>Strength</b></td><td>4-5 × 3-5</td><td>${z(0, 0, 3, 5)}</td></tr>
      <tr><td><b>Growth</b></td><td>3-4 × 8-12</td><td>${z(0, 0, 8, 12)}</td></tr>
      <tr><td><b>Endurance</b></td><td>2-3 × 15-20</td><td>${z(0, 0, 15, 20)}</td></tr></tbody></table>
      <div class="tiny muted" style="margin-top:6px">From your ${wm.src} max of ${fmtN(wm.v)} lb, leaving about 1-2 reps in the tank. In a workout, each set suggests a weight for its rep target.</div>`;
  }
  h += `<div class="stack" style="margin-top:12px"><button class="btn primary block" id="maxbtn">Find my 1-rep max</button></div></div>`;
  v.innerHTML = h;
  $("#exsel", v).onchange = e => { S.progressEx = e.target.value; store.set("progressEx", S.progressEx); render(); };
  v.querySelectorAll("[data-metric]").forEach(b => b.onclick = () => { S.chartMetric = b.dataset.metric; store.set("chartMetric", S.chartMetric); render(); });
  $("#maxbtn", v).onclick = () => sheetMax(ex);
}

function sheetMax(key) {
  const [name, variation] = key.split(" · ");
  const est = estMax(key), tst = testedMax(key);
  const draw = (s, guess) => {
    const E = guess || (est ? est.v : 0);
    const steps = E ? [[info(name).bar ? 45 : round5(E * .3), 10, "Warm-up"], [round5(E * .5), 5, "Warm-up"], [round5(E * .65), 3, "Warm-up"], [round5(E * .8), 2, "Warm-up"], [round5(E * .9), 1, "Opener"], [round5(E * 1.0), 1, "Attempt"], [round5(E * 1.03), 1, "Only if the last one moved well"]] : [];
    s.innerHTML = `<div class="kick">${esc(key)}</div><h3>Find your 1-rep max</h3>
      <p class="small muted">Your 1-rep max is the most you can lift once with good form. A tested max sets your training weights more accurately than the estimate.</p>
      ${E ? `<div class="ladder">${steps.map((x, i) => `<span class="muted">${i + 1}</span><span>${esc(x[2])}</span><b>${fmtN(x[0])} lb × ${x[1]}</b>`).join("")}</div>
      <p class="tiny muted">Rest 3-5 minutes between the heavy singles. Use a spotter or safety bars on bench and squat. Stop the test when a rep slows down a lot or your form slips: that's your max for today.</p>
      <button class="btn primary block" id="go">Start the max test</button>` : `<div class="field" style="margin:10px 0"><label for="gs">Your best guess at a 1-rep max (lb)</label><input id="gs" inputmode="decimal" placeholder="e.g. 185"></div><button class="btn primary block" id="mk">Build my warm-up</button>`}
      <h2 style="margin-top:18px">Already know it?</h2><div class="grid2"><div class="field"><label for="mx">Max (lb)</label><input id="mx" inputmode="decimal" value="${tst ? esc(tst.weight) : ""}"></div><div class="field"><label for="md">Date</label><input id="md" type="date" value="${tst ? esc(tst.date) : ymd(new Date())}"></div></div>
      <div class="stack" style="margin-top:10px"><button class="btn block" id="sv">Save tested max</button><button class="btn block" id="x">Close</button></div>`;
    const mk = $("#mk", s); if (mk) mk.onclick = () => { const g = num($("#gs", s).value); if (g) draw(s, g); };
    const go = $("#go", s); if (go) go.onclick = () => { closeSheet(); startWorkout({ id: null, name: `1RM test: ${key}`, maxTest: key, exercises: [{ name, variation: variation || "", sets: steps.length, reps: "1", rest: 180 }] }, null, steps); };
    $("#sv", s).onclick = () => { const w = num($("#mx", s).value); if (!w) { $("#mx", s).focus(); return; } saveMax(key, w, 1, $("#md", s).value || ymd(new Date())).then(() => { toast("Max saved"); closeSheet(); }); };
    $("#x", s).onclick = closeSheet;
  };
  sheet("", s => draw(s, 0));
}
const saveMax = (key, weight, reps, date) => write(db => db.doc("maxes/" + slug(key)).set({ key, weight, reps, date, updatedAt: Date.now() })).catch(() => toast("Couldn't save. Check your connection."));

// ───────────────────────── ROUTINES + SETTINGS ─────────────────────────
function viewRoutines(v) {
  if (S.routines === null && S.conn !== "off") { v.innerHTML = loadingCard("your routines"); return; }
  const rs = routinesSorted(), sch = (S.config && S.config.schedule) || {};
  const opts = [...new Set([...rs.map(r => r.name), ...Object.values(sch).filter(Boolean), "Cardio: 30 min brisk walk, bike or incline treadmill", "Active: hike, long walk, golf or anything outdoors", "Rest"])];
  let h = `<h2>Weekly schedule</h2><div class="card">${DAYS.map(d => `<div class="sched"><label for="sc-${d}" class="small"><b>${d}</b></label><select id="sc-${d}" data-day="${d}"><option value="">—</option>${opts.map(o => `<option ${sch[d] === o ? "selected" : ""} value="${esc(o)}">${esc(o.length > 38 ? o.slice(0, 36) + "…" : o)}</option>`).join("")}</select></div>`).join("")}
    <div class="tiny muted" style="margin-top:6px">Your Today screen, your Obsidian daily note and the gym slot in your day plan follow this schedule.</div></div>`;

    <div class="tiny muted">When you start a routine you pick where you are, and exercises that need missing equipment swap to the closest one you can do. Planet Fitness usually has Smith machines instead of barbell racks; untick Barbell if yours does.</div></div>`;
  h += `<h2>Routines</h2><div class="stack">`;
  if (!rs.length) h += `<div class="card empty"><b>No routines yet</b>Make one with the button below, or start an empty workout and add exercises as you go.</div>`;
  rs.forEach(r => h += `<div class="card"><div class="row"><div class="grow"><div class="ex-name">${esc(r.name)}</div><div class="tiny muted">${r.exercises.length} exercises · ${r.exercises.reduce((a, e) => a + num(e.sets), 0)} sets</div></div><button class="btn sm" data-edit="${esc(r.id)}">Edit</button></div>
    <div class="exlist" style="margin-bottom:12px">${r.exercises.map(e => `<div class="exline"><b>${e.superset ? "⛓ " : ""}${esc(keyOf(e.name, e.variation))}</b><span>${esc(e.sets)} × ${esc(e.reps)} · ${fmtRest(num(e.rest || 90))}</span></div>`).join("")}</div>
    <button class="btn primary block" data-start="${esc(r.id)}">Start</button></div>`);
  h += `</div><div class="stack" style="margin-top:12px"><button class="btn block" data-new>New routine</button><button class="btn block" data-empty>Start an empty workout</button><button class="btn block" data-cardio>Log cardio</button><button class="btn block" data-iv="pick">⏱ Interval / HIIT timer</button></div>`;
  const P = prefs();
  h += `<h2>Alerts and warm-ups</h2><div class="card">${[["sound", "Beeps", "Countdown beeps at the end of rests and timers"], ["voice", "Spoken cues", "\"Rest over. Bench Press, set 3\" (great with AirPods)"], ["warn10", "10-second warning", "A heads-up before each rest ends"], ["warmup", "Warm-up set on each lift", "Adds a warm-up set at 50% of your max (or 60% of last time's top weight)"], ["awake", "Keep screen on", "Stops the screen sleeping during a workout. Not needed for rest alerts, and uses more battery."]].map(([k, t, d]) => `<div class="toggle ${P[k] ? "on" : ""}" data-pref="${k}" role="switch" aria-checked="${P[k]}" tabindex="0"><div><b>${t}</b><div class="tiny muted">${esc(d)}</div></div><span class="sw"></span></div>`).join("")}
    <div class="tiny muted" style="margin-top:8px">Beeps and spoken cues play while Lift Log is on screen. With the screen off, the notification setting below pings you when each rest ends.</div></div>`;
  h += pushCard();
  h += `<h2>Apple Watch and Health</h2><div class="note">Lift Log runs on your iPhone. Web pages can't write to Apple Health, so start the watch's Workout app (Traditional Strength Training) alongside it: that saves time, heart rate and calories to Health. Your sets stay in Lift Log and your vault.</div>`;
  v.innerHTML = h;
  bindPush(v);
  v.querySelectorAll("[data-day]").forEach(s => s.onchange = () => { const schedule = { ...((S.config && S.config.schedule) || {}) }; schedule[s.dataset.day] = s.value; S.config = { ...(S.config || {}), schedule }; saveConfig().then(() => toast("Schedule saved")).catch(() => toast("Couldn't save. Check your connection.")); });
  v.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => { toggleEquip(b.dataset.loc, b.dataset.eq); render(); });

  v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => sheetRoutine(rs.find(r => r.id === b.dataset.edit)));

function toggleEquip(locId, eq) {
  const locs = JSON.parse(JSON.stringify(locations()));
  const l = locs.find(x => x.id === locId); if (!l) return;
  l.equip = l.equip.includes(eq) ? l.equip.filter(x => x !== eq) : [...l.equip, eq];
  S.config = { ...(S.config || {}), locations: locs };
  saveConfig().catch(() => toast("Couldn't save. Check your connection."));
}

// ───────────────────────── sheets ─────────────────────────
function sheet(html, bind) {
  closeSheet();
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  bind && bind(bg.firstChild);
  return bg.firstChild;
}
function closeSheet() { document.querySelectorAll(".sheet-bg").forEach(x => x.remove()); document.body.style.overflow = ""; }

function sheetPickWorkout() {
  const rs = routinesSorted();
  sheet(`<h3>Start a workout</h3><div class="stack" style="margin-top:12px">${rs.map(r => `<button class="btn block" data-r="${esc(r.id)}">${esc(r.name)}</button>`).join("")}<button class="btn block" data-r="">Empty workout</button><button class="btn block" data-c>Log cardio</button><button class="btn block" data-x>Cancel</button></div>`, s => {
    s.querySelectorAll("[data-r]").forEach(b => b.onclick = () => sheetStart(rs.find(r => r.id === b.dataset.r) || null));
    $("[data-c]", s).onclick = sheetCardio; $("[data-x]", s).onclick = closeSheet;
  });
}

// Pick where you're training; preview the swaps; start.
function sheetStart(r) {
  let locId = (S.config && S.config.lastLocation) || "gym";
  const draw = s => {
    const loc = locById(locId);
    const rows = r ? r.exercises.map(e => { const sw = swapFor(e.name, loc.equip); return { e, sw, ok: canDo(sw, loc.equip) }; }) : [];
    s.innerHTML = `<div class="kick">${esc(r ? r.name : "Empty workout")}</div><h3>Where are you training?</h3>
      <div class="chips" style="margin:12px 0">${locations().map(l => `<button class="chip big ${l.id === loc.id ? "on" : ""}" data-l="${esc(l.id)}">${esc(l.icon + " " + l.name)}</button>`).join("")}</div>
      <div class="tiny muted" style="margin-bottom:6px">Equipment here today (tap to change):</div>
      <div class="chips">${EQUIP.map(([k, lab]) => `<button class="chip ${loc.equip.includes(k) ? "on" : ""}" data-eq="${k}" aria-pressed="${loc.equip.includes(k)}">${esc(lab)}</button>`).join("")}</div>
      ${r ? `<h2>Today's exercises</h2><div class="exlist" style="margin-top:0">${rows.map(x => `<div><div class="exline"><b>${esc(keyOf(x.sw, x.sw === x.e.name ? x.e.variation : ""))}</b><span>${esc(x.e.sets)} × ${esc(x.e.reps)}</span></div>${x.sw !== x.e.name ? `<div class="swap">↺ instead of ${esc(x.e.name)}</div>` : ""}${!x.ok ? `<div class="swap" style="color:var(--warn)">Needs ${esc(info(x.sw).equip.filter(q => !loc.equip.includes(q)).join(", "))}. Swap it in the workout.</div>` : ""}</div>`).join("")}</div>` : ""}
      <div class="stack" style="margin-top:14px"><button class="btn primary block" id="go">Start</button><button class="btn block" id="x">Cancel</button></div>`;
    s.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { locId = b.dataset.l; draw(s); });
    s.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => { toggleEquip(loc.id, b.dataset.eq); draw(s); });
    $("#x", s).onclick = closeSheet;
    $("#go", s).onclick = () => {
      closeSheet();
      if ((S.config || {}).lastLocation !== loc.id) { S.config = { ...(S.config || {}), lastLocation: loc.id }; saveConfig().catch(() => { }); }
      startWorkout(r, loc);
    };
  };
  sheet("", draw);
}

function sheetCardio() {
  const sched = scheduleFor(new Date()), guess = CARDIO.find(c => sched.toLowerCase().includes(c.split(" ")[0].toLowerCase())) || "Brisk walk";
  sheet(`<h3>Log cardio</h3><div class="stack" style="margin-top:12px">
    <div class="field"><label for="ca">Activity</label><select id="ca">${CARDIO.map(c => `<option ${c === guess ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
    <div class="grid2"><div class="field"><label for="cm">Minutes</label><input id="cm" inputmode="numeric" value="30"></div><div class="field"><label for="cd">Miles (optional)</label><input id="cd" inputmode="decimal" placeholder="—"></div></div>
    <div class="field"><label for="cdate">Date</label><input id="cdate" type="date" value="${ymd(new Date())}"></div>
    <button class="btn primary block" id="csave">Save cardio</button><button class="btn block" id="cx">Cancel</button></div>`, s => {
    $("#cx", s).onclick = closeSheet;
    $("#csave", s).onclick = () => {
      const min = num($("#cm", s).value); if (!min) { $("#cm", s).focus(); return; }
      const date = $("#cdate", s).value || ymd(new Date()), t = parseYmd(date).getTime() + 12 * 3600e3, isToday = date === ymd(new Date());

function startWorkout(r, loc, ladder) {

  S.active = {
    id: uid(), routine: r ? r.name : "Workout", routineId: r ? r.id : null, startedAt: Date.now(), date: ymd(new Date()), notes: "", location: loc.id, maxTest: r && r.maxTest ? r.maxTest : null,

  saveActive(true); keepAwake(true); window.scrollTo(0, 0); render();
}

// Supersets: an exercise with ss:true is linked to the next one. Returns, per exercise, its group or null.
function ssGroups() {
  const X = S.active.exercises, out = new Array(X.length).fill(null); let letter = 0;

    if (cfg.rest && !lastOne) seq.push({ phase: "rest", secs: cfg.rest, label: "Rest", round: r, k });
  });
  let TOTAL = 0; seq.forEach(p => { p.start = TOTAL; TOTAL += p.secs; });
  const ov = document.createElement("div"); ov.className = "hiit prep"; ov.setAttribute("role", "timer"); document.body.appendChild(ov);
  // Position comes from the clock, not from counting ticks, so it's still right after the screen has been off.
  let idx = 0, t0 = Date.now(), pausedAt = 0, pausedTot = 0, t = null, lastWhole = null, finished = false, cut = -1; const started = t0;
  const elapsed = () => ((pausedAt || Date.now()) - t0 - pausedTot) / 1000;
  const nm = p => p.label === "Work" ? "work" : p.label;
  keepAwake(true);
  // Pings: one row per upcoming phase change, rescheduled on pause/resume/skip and when you leave the app.
  const Q = () => S.db.sb.from("lift_push_queue");
  const pushAll = () => {
    if (!PUSH.on || !S.db || finished || pausedAt) return;
    const base = Date.now() - elapsed() * 1000, rows = [];
    for (let n = idx + 1; n < seq.length && rows.length < 150; n++) {
      const p = seq[n], nx = seq[n + 1];
      if (n === cut) continue;
      rows.push({ id: "hiit-" + n, fire_at: new Date(base + p.start * 1000 - 2000).toISOString(), tag: "hiit", sent: false,
        title: p.phase === "work" ? (p.label === "Work" ? "Go!" : "Go: " + p.label) : "Rest" + (nx ? " · next: " + nm(nx) : ""),
        body: `${cfg.name} · round ${p.round} of ${cfg.rounds}` });
    }
    if (cut !== seq.length) rows.push({ id: "hiit-end", fire_at: new Date(base + TOTAL * 1000 - 2000).toISOString(), tag: "hiit", sent: false, title: "Done", body: `${cfg.name} complete. Nice work.` });
    pushQ(() => Q().delete().like("id", "hiit-%").then(() => rows.length ? Q().upsert(rows) : null));
  };
  const pushNone = () => { if (PUSH.on && S.db) pushQ(() => Q().delete().like("id", "hiit-%")); };
  const onVis = () => { if (document.visibilityState === "hidden") { cut = -1; pushAll(); } };
  document.addEventListener("visibilitychange", onVis);
  const announce = () => { const p = seq[idx], nx = seq[idx + 1]; beep(p.phase === "work" ? 988 : 660, 240); say(p.phase === "work" ? (p.label === "Work" ? "Go" : p.label) : p.phase === "rest" ? (nx ? `Rest. Next: ${nm(nx)}` : "Rest") : `Get ready. First: ${seq[1] ? seq[1].label : "work"}`); };
  const toggle = () => {
    if (finished) return;
    if (pausedAt) { pausedTot += Date.now() - pausedAt; pausedAt = 0; pushAll(); } else { pausedAt = Date.now(); pushNone(); }
    draw();
  };
  const skip = () => { const nx = seq[idx + 1]; if (!nx) return done(false); t0 -= (nx.start - elapsed()) * 1000; idx++; lastWhole = null; cut = -1; announce(); draw(); pushAll(); };
  const draw = () => {
    const p = seq[idx], nx = seq[idx + 1], left = Math.max(0, p.start + p.secs - elapsed());
    ov.className = "hiit " + p.phase;
    ov.innerHTML = `<div class="phase">${p.phase === "prep" ? "Get ready" : p.phase === "work" ? "Work" : "Rest"}</div><div class="count">${Math.ceil(left)}</div>
      <div class="lbl">${esc(p.phase === "work" ? (p.label === "Work" ? cfg.name : p.label) : nx ? "Next: " + nm(nx) : "")}</div>
      <div class="meta">${p.round ? `Round ${p.round} of ${cfg.rounds}${items.length > 1 ? ` · ${p.k + 1} of ${items.length}` : ""}` : esc(cfg.name)}</div>
      <div class="row" style="margin-top:18px"><button class="btn" id="ivp">${pausedAt ? "▶ Resume" : "⏸ Pause"}</button><button class="btn" id="ivs">⏭ Skip</button><button class="btn" id="ivx">✕ Stop</button></div>`;
    $("#ivp", ov).onclick = toggle;
    $("#ivs", ov).onclick = skip;
    $("#ivx", ov).onclick = () => done(true);
  };
  const done = stopped => {
    if (finished) return; finished = true;
    clearInterval(t); document.removeEventListener("visibilitychange", onVis); pushNone(); if (!S.active) wake(false);
    const dur = Math.min(elapsed(), TOTAL), late = elapsed() - TOTAL, mins = Math.max(1, Math.round(dur / 60));
    if (stopped && idx <= 1) { ov.remove(); return; }
    if (stopped || late < 2) { beep(988, 200); beep(1318, 300, .22); say(stopped ? "Stopped" : "Done. Nice work."); }
    ov.className = "hiit work";
    ov.innerHTML = `<div class="phase">${stopped ? "Stopped" : "Done"}</div><div class="count" style="font-size:min(24vw,120px)">${mmss(dur)}</div><div class="lbl">${esc(cfg.name)}</div>
      <div class="stack" style="margin-top:18px;width:min(100%,360px)">${cfg.save && !S.active ? `<button class="btn block" id="ivsave">Save as a ${mins}-minute workout</button>` : ""}<button class="btn block" id="ivc">Close</button></div>`;
    const sv = $("#ivsave", ov); if (sv) sv.onclick = () => {
      const w = { id: uid(), kind: "cardio", date: ymd(new Date()), activity: cfg.name, minutes: mins, distance: null, startedAt: started, endedAt: started + Math.round(dur * 1000), volume: 0, setsDone: 0, prs: [], createdAt: Date.now(), intervals: { work: cfg.work, rest: cfg.rest, rounds: cfg.rounds } };
      const copied = copyHandoff(w); ov.remove();
      saveWorkout(w, () => copied.then(ok => toast(ok ? `${cfg.name} saved and copied. Tick Workout in your daily note.` : `${cfg.name} saved`)));
    };
    $("#ivc", ov).onclick = () => ov.remove();
  };
  announce(); draw(); pushAll();
  t = setInterval(() => {
    if (!ov.isConnected) { clearInterval(t); return; }
    if (finished) return;
    const el = elapsed(); if (el >= TOTAL) return done(false);
    let n = idx; while (n < seq.length - 1 && el >= seq[n + 1].start) n++;
    if (n !== idx) { const fresh = el - seq[n].start < 1.5; idx = n; lastWhole = null; if (fresh) announce(); draw(); }
    const p = seq[idx], left = p.start + p.secs - el, c = $(".count", ov);
    if (c) c.textContent = Math.ceil(Math.max(0, left));
    // On screen near a phase change: the in-app beep covers it, so drop that one ping.
    const nextN = idx + 1 < seq.length ? idx + 1 : seq.length;
    if (!pausedAt && left <= 6 && cut !== nextN && document.visibilityState === "visible" && PUSH.on && S.db) { cut = nextN; pushQ(() => Q().delete().eq("id", nextN === seq.length ? "hiit-end" : "hiit-" + nextN)); }
    if (!pausedAt) { const w = Math.ceil(left); if (left <= 3.2 && left > 0.2 && w !== lastWhole) { lastWhole = w; beep(560, 90); } }
  }, 200);
}

const MILESTONES_LB = [10000, 25000, 50000, 100000, 250000, 500000, 1000000, 2500000];
const MILESTONES_N = [1, 5, 10, 25, 50, 100, 200, 365, 500];
function summary(w, copied, ctx) {
  if (w.kind === "cardio") return;
  const ff = funFact(w.volume, hash(w.id)), lifeAfter = ctx.lifeBefore + w.volume, n = ctx.countBefore + 1;
  const lbM = MILESTONES_LB.filter(m => ctx.lifeBefore < m && lifeAfter >= m).pop(), nM = MILESTONES_N.includes(n) ? n : 0, st = trainingStreak();
  const wins = [];
  if (ctx.newMax) wins.push(`🎯 New tested max: ${ctx.newMax.weight} lb`);
  w.prs.forEach(p => wins.push(`🏆 New record: ${p}`));
  if (lbM) { const f = funFact(lbM, 1); wins.push(`🎉 ${fmtN(lbM)} lb lifted all-time${f ? ` (${f.text})` : ""}`); }
  if (nM) wins.push(`💪 Workout number ${n}${n === 1 ? ". The first one's the hardest." : "!"}`);
  if (st >= 3) wins.push(`🔥 ${st} training days in a row`);
  sheet(`<div class="kick">Workout complete</div><h3>${esc(w.routine)}</h3><div class="sum"><div class="tile"><b>${mmss((w.endedAt - w.startedAt) / 1000)}</b><span>time</span></div><div class="tile"><b>${w.setsDone}</b><span>sets</span></div><div class="tile"><b>${fmtK(w.volume)}</b><span>lb moved</span></div></div>
    ${ff ? `<div class="fact" style="margin-bottom:12px"><div class="ico">${ff.ico}</div><div>You moved <b>${fmtN(w.volume)} lb</b> today. That's about <b>${esc(ff.text)}</b>.</div></div>` : ""}
    ${wins.length ? `<div class="stack" style="margin-bottom:12px">${wins.map(x => `<span class="badge" style="font-size:13px;padding:6px 10px">${esc(x)}</span>`).join("")}</div>` : ""}
    <p class="small muted">${esc(CHEERS[Math.abs(hash(w.id)) % CHEERS.length])}</p>
    <div class="note" id="handoff" style="margin-bottom:10px">Copying for Obsidian…</div><div class="stack"><button class="btn block" id="cp2" hidden>Copy for Obsidian</button><button class="btn primary block" id="x">Done</button></div>`, s => {
    $("#x", s).onclick = closeSheet;
    $("#cp2", s).onclick = () => copyHandoff(w).then(ok => { $("#handoff", s).innerHTML = ok ? "<b>Copied.</b> Now tick Workout in today's daily note." : "This device won't allow copying. Ask Claude to sync your Lift Log workouts instead."; $("#cp2", s).hidden = ok; });
  });
  (copied || Promise.resolve(false)).then(ok => { const nb = $("#handoff"); if (!nb) return; nb.innerHTML = ok ? "<b>Copied for Obsidian.</b> Open today's daily note and tick Workout to save these sets there." : `Tap <b>Copy for Obsidian</b>, then tick Workout in today's daily note.`; const b = $("#cp2"); if (b) b.hidden = ok; });
}

// ───────────────────────── boot ─────────────────────────
render();
if (S.active) keepAwake(true);
connect();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
})();
</script>
